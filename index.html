<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Stații apropiate · Multi-oraș</title>
  <link rel="icon" href="data:," />
  <style>
    body{margin:0;font:16px system-ui;background:#f5f7fa;color:#1f2937}
    header{padding:14px 16px}
    h1{margin:0;font-size:1.08rem}
    p{margin:.35rem 0 0;color:#6b7280}
    #map{height:45vh;min-height:280px;margin:0 16px;border:1px solid #d1d5db;border-radius:12px;background:#e5e7eb}
    .bar{padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap}
    button,select{padding:10px 12px;border-radius:10px;border:1px solid #d1d5db;background:#fff}
    button{background:#0b5c8a;color:#fff;border-color:#0b5c8a}
    #status{margin:0 16px 8px;padding:10px;border:1px solid #d1d5db;border-radius:10px;background:#fff;color:#6b7280}
    ul{list-style:none;margin:0;padding:0 16px 20px;display:grid;gap:8px}
    li{background:#fff;border:1px solid #d1d5db;border-radius:10px;padding:10px}
    .name{font-weight:600}
    .meta{color:#6b7280;font-size:.92rem}
    .city{font-size:.9rem;color:#0b5c8a}
  </style>
</head>
<body>
  <header>
    <h1>Stații apropiate</h1>
    <p>Multi-oraș: JSON local per oraș + fallback Overpass</p>
  </header>

  <div class="bar">
    <button id="locate" type="button">Locația mea</button>
    <select id="radius">
      <option value="300">300 m</option>
      <option value="500" selected>500 m</option>
      <option value="800">800 m</option>
      <option value="1200">1200 m</option>
    </select>
  </div>

  <div id="map"></div>
  <div id="status">Încarc...</div>
  <ul id="list"></ul>

  <script>
    const statusEl = document.getElementById("status");
    const listEl = document.getElementById("list");
    const radiusEl = document.getElementById("radius");
    const locateBtn = document.getElementById("locate");

    function setStatus(t){ statusEl.textContent = t; }

    function loadScript(src){
      return new Promise((resolve,reject)=>{
        const s=document.createElement("script");
        s.src=src; s.async=true; s.onload=resolve; s.onerror=reject;
        document.head.appendChild(s);
      });
    }
    function loadCss(href){
      return new Promise((resolve,reject)=>{
        const l=document.createElement("link");
        l.rel="stylesheet"; l.href=href; l.onload=resolve; l.onerror=reject;
        document.head.appendChild(l);
      });
    }

    async function loadLeaflet(){
      const cdn = [
        ["https://unpkg.com/leaflet@1.9.4/dist/leaflet.css","https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"],
        ["https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css","https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"],
        ["https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css","https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"]
      ];
      for (const [css,js] of cdn){
        try{
          await loadCss(css);
          await loadScript(js);
          if(window.L) return true;
        }catch(e){}
      }
      return false;
    }

    function dist(a,b){
      const R=6371000, p=Math.PI/180;
      const dLat=(b[0]-a[0])*p, dLon=(b[1]-a[1])*p;
      const x=Math.sin(dLat/2)**2 + Math.cos(a[0]*p)*Math.cos(b[0]*p)*Math.sin(dLon/2)**2;
      return 2*R*Math.asin(Math.sqrt(x));
    }

    function slugCity(name){
      return String(name || "")
        .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
        .toLowerCase()
        .replace(/[^a-z0-9]+/g,"-")
        .replace(/^-+|-+$/g,"");
    }

    async function detectCity(lat, lon){
      try{
        const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}&accept-language=ro`;
        const r = await fetch(url, {headers:{'Accept':'application/json'}});
        if(!r.ok) throw new Error("reverse geocode fail");
        const j = await r.json();
        const a = j.address || {};
        return a.city || a.town || a.municipality || a.village || a.county || null;
      }catch(e){
        return null;
      }
    }

    function qStops(lat, lon, r){
      const a = `(around:${r},${lat},${lon})`;
      return `[out:json][timeout:60];
      (
        node${a}[public_transport=platform];
        node${a}[highway=bus_stop];
        node${a}[railway=tram_stop];
      );
      out body;`;
    }

    function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

    async function overpass(query){
      const eps = [
        "https://overpass.kumi.systems/api/interpreter",
        "https://overpass.private.coffee/api/interpreter",
        "https://overpass-api.de/api/interpreter",
        "https://lz4.overpass-api.de/api/interpreter",
        "https://z.overpass-api.de/api/interpreter"
      ];
      const retryable = new Set([429,500,502,503,504]);

      for (const ep of eps){
        for (let i=0; i<3; i++){
          const ctrl = new AbortController();
          const t = setTimeout(()=>ctrl.abort(), 30000);

          try{
            const res = await fetch(ep + "?data=" + encodeURIComponent(query), {
              signal: ctrl.signal,
              headers: { "Accept":"application/json,text/plain;q=0.9,*/*;q=0.8" }
            });

            if (!res.ok){
              if (retryable.has(res.status)) throw new Error("HTTP " + res.status + " retry");
              throw new Error("HTTP " + res.status);
            }

            const text = await res.text();
            const json = JSON.parse(text);
            if (!json || !Array.isArray(json.elements)) throw new Error("JSON invalid");
            clearTimeout(t);
            return json;
          }catch(e){
            clearTimeout(t);
            await sleep(500 + i*700);
          }
        }
      }
      throw new Error("Overpass indisponibil");
    }

    async function loadCityJson(cityName){
      if(!cityName) return null;
      const slug = slugCity(cityName);

      // încearcă root, apoi /data
      const paths = [`./${slug}.json`, `./data/${slug}.json`];

      for (const path of paths){
        try{
          const r = await fetch(path, {cache:"no-store"});
          if(!r.ok) continue;
          const j = await r.json();
          if(!Array.isArray(j)) continue;
          return {city:cityName, slug, stations:j, path};
        }catch(e){}
      }
      return null;
    }

    (async function init(){
      setStatus("Încarc Leaflet...");
      const ok = await loadLeaflet();
      if(!ok){ setStatus("Nu pot încărca Leaflet."); return; }

      const center = [45.7537, 21.2257];
      const map = L.map("map").setView(center, 14);
      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19, attribution: "&copy; OpenStreetMap"
      }).addTo(map);

      const layer = L.layerGroup().addTo(map);
      let me = null, circle = null, point = center.slice();
      let sourceInfo = "fallback Overpass";

      async function renderFromData(stations){
        const r = parseInt(radiusEl.value,10);
        layer.clearLayers();
        listEl.innerHTML = "";

        const near = stations
          .filter(s => typeof s.lat==="number" && typeof s.lon==="number")
          .map(s => ({...s, d: dist(point,[s.lat,s.lon])}))
          .filter(s => s.d <= r)
          .sort((a,b)=>a.d-b.d);

        if(!near.length){
          setStatus(`Nicio stație în ${r} m (${sourceInfo}).`);
          return;
        }

        near.forEach(s=>{
          const nm = s.name || "Stație fără nume";
          L.circleMarker([s.lat,s.lon],{
            radius:7,color:"#fff",weight:2,fillColor:"#c8362d",fillOpacity:1
          }).bindTooltip(nm).addTo(layer);

          const li=document.createElement("li");
          li.innerHTML = `
            <div class="name">${nm}</div>
            <div class="meta">${Math.round(s.d)} m</div>
            <div class="city">${sourceInfo}</div>
          `;
          listEl.appendChild(li);
        });

        setStatus(`Găsite ${near.length} stații în ${r} m (${sourceInfo}).`);
      }

      async function loadStopsDynamic(){
        const r = parseInt(radiusEl.value,10);
        setStatus("Caut orașul și stațiile...");
        layer.clearLayers();
        listEl.innerHTML = "";

        const city = await detectCity(point[0], point[1]);
        const local = await loadCityJson(city);

        if(local){
          sourceInfo = `fișier local: ${local.path.replace("./","")}`;
          await renderFromData(local.stations);
          return;
        }

        // fallback Overpass dacă nu există JSON local pentru oraș
        sourceInfo = city ? `Overpass (${city})` : "Overpass";
        setStatus(`Nu există JSON local pentru ${city || "oraș"}. Folosesc Overpass...`);
        try{
          const data = await overpass(qStops(point[0], point[1], r));
          const nodes = (data.elements||[]).filter(e=>e.type==="node");
          const stations = nodes.map(n=>({
            name: (n.tags && n.tags.name) ? n.tags.name : "Stație fără nume",
            lat: n.lat,
            lon: n.lon
          }));
          await renderFromData(stations);
        }catch(e){
          setStatus("Eroare: " + e.message);
        }
      }

      function setPoint(lat,lon,fit){
        point=[lat,lon];
        const r = parseInt(radiusEl.value,10);

        if(me) map.removeLayer(me);
        if(circle) map.removeLayer(circle);

        me = L.circleMarker(point,{
          radius:8,color:"#fff",weight:3,fillColor:"#0b5c8a",fillOpacity:1
        }).addTo(map);

        circle = L.circle(point,{
          radius:r,color:"#0b5c8a",weight:1,fillOpacity:0.07
        }).addTo(map);

        if(fit) map.fitBounds(circle.getBounds(), {padding:[10,10]});
        loadStopsDynamic();
      }

      locateBtn.onclick = () => {
        if(!navigator.geolocation){ setStatus("Geolocația nu e disponibilă."); return; }
        if(!window.isSecureContext){ setStatus("Geolocația cere HTTPS."); return; }

        setStatus("Cer locația...");
        navigator.geolocation.getCurrentPosition(
          p => setPoint(p.coords.latitude,p.coords.longitude,true),
          _ => setStatus("Nu pot lua locația. Apasă pe hartă manual.")
        );
      };

      radiusEl.onchange = () => setPoint(point[0],point[1],true);
      map.on("click", e => setPoint(e.latlng.lat, e.latlng.lng, true));

      // pornește din centru
      setPoint(center[0], center[1], false);
    })().catch(err=>{
      console.error(err);
      setStatus("Eroare la pornire: " + err.message);
    });
  </script>
</body>
</html>
