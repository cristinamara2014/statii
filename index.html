<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Stații în apropiere · Timișoara</title>
  <link rel="icon" href="data:," />

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />

  <style>
    :root{
      --bg:#f3f5f7; --surface:#ffffff; --ink:#14212b; --muted:#5d6b76; --line:#d9e0e5;
      --accent:#0b5c8a; --tram:#c8362d; --troll:#1b6fb5; --bus:#2f7d4f;
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark){
      :root{
        --bg:#10171c; --surface:#18222a; --ink:#e8eef2; --muted:#93a3ae; --line:#2a3944;
        --accent:#5eb4e6; --tram:#e5645b; --troll:#5aa3e0; --bus:#5fb583;
      }
    }

    *{box-sizing:border-box}
    body{
      margin:0;background:var(--bg);color:var(--ink);
      font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
      padding-top:env(safe-area-inset-top,0px);
      padding-bottom:env(safe-area-inset-bottom,0px);
    }
    header{padding:16px 16px 8px}
    h1{margin:0;font-size:1.3rem}
    header p{margin:4px 0 0;color:var(--muted);font-size:.92rem}

    .controls{display:flex;gap:8px;flex-wrap:wrap;padding:8px 16px 12px}
    button,select,a.maplink{
      font:inherit;border-radius:10px;border:1px solid var(--line);
      background:var(--surface);color:var(--ink);padding:10px 14px;min-height:44px;
    }
    button{cursor:pointer}
    button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
    button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

    #map{
      height:40vh; min-height:240px; margin:0 16px; border-radius:14px; border:1px solid var(--line);
    }
    #status{padding:12px 16px 4px;color:var(--muted);font-size:.92rem}
    #list{list-style:none;margin:0;padding:4px 16px 28px;display:grid;gap:10px;max-width:780px}

    .stop{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
    .stop.active{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
    .top{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
    .name{font-weight:650}
    .dist{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
    .hint{color:var(--muted);font-size:.86rem;margin-top:8px}

    .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
    .chip{
      display:inline-flex;align-items:center;justify-content:center;
      min-height:38px;min-width:44px;padding:6px 12px;border-radius:9px;
      color:#fff;font-weight:700;font-size:.92rem;text-decoration:none;border:none;
    }
    .chip.tram{background:var(--tram)}
    .chip.trolleybus{background:var(--troll)}
    .chip.bus{background:var(--bus)}

    .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
    a.maplink{
      text-decoration:none;display:inline-flex;align-items:center;justify-content:center;
      color:var(--accent);
    }

    details{margin-top:8px}
    summary{cursor:pointer;color:var(--accent);font-size:.9rem;min-height:32px;display:flex;align-items:center}
    .routes{margin:6px 0 0;padding:0;list-style:none;font-size:.92rem;display:grid;gap:6px}
    .routes b{display:inline-block;min-width:2.2em}
  </style>
</head>
<body>
  <header>
    <h1>Stații în apropiere</h1>
    <p>Timișoara · apasă pe linie pentru Google Maps</p>
  </header>

  <div class="controls">
    <button class="primary" id="locate" type="button">Folosește locația mea</button>
    <select id="radius" aria-label="Rază de căutare">
      <option value="300">300 m</option>
      <option value="500" selected>500 m</option>
      <option value="800">800 m</option>
    </select>
  </div>

  <div id="map" aria-label="Hartă cu stații"></div>
  <div id="status">Apasă pe buton sau atinge un punct pe hartă.</div>
  <ul id="list"></ul>

  <!-- Leaflet JS -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <script>
    (function(){
      if (!window.L) {
        document.getElementById("status").textContent =
          "Eroare: Leaflet nu s-a încărcat (L lipsește).";
        return;
      }

      const CENTER = [45.7537, 21.2257];
      const MODE_LABEL = { tram:"Tramvai", trolleybus:"Troleibuz", bus:"Autobuz" };
      const MODE_ORDER = { tram:0, trolleybus:1, bus:2 };

      const OVERPASS_LIST = [
        "https://overpass.kumi.systems/api/interpreter",
        "https://overpass-api.de/api/interpreter"
      ];

      const map = L.map("map").setView(CENTER, 14);

      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: "&copy; OpenStreetMap contributors"
      }).addTo(map);

      let me = null, circle = null, layer = L.layerGroup().addTo(map), markers = {};
      let last = null, reqId = 0;

      const statusEl = document.getElementById("status");
      const listEl = document.getElementById("list");
      const radiusEl = document.getElementById("radius");

      function setStatus(t){ statusEl.textContent = t; }

      function dist(a,b){
        const R=6371000, r=Math.PI/180;
        const dLat=(b[0]-a[0])*r, dLon=(b[1]-a[1])*r;
        const s1=Math.sin(dLat/2), s2=Math.sin(dLon/2);
        const x=s1*s1 + Math.cos(a[0]*r)*Math.cos(b[0]*r)*s2*s2;
        return 2*R*Math.asin(Math.sqrt(x));
      }

      function openLineInGoogleMaps(line, stopName){
        const q = encodeURIComponent(`STPT linia ${line} stația ${stopName} Timisoara`);
        window.open(`https://www.google.com/maps/search/?api=1&query=${q}`, "_blank");
      }

      function openStopInGoogleMaps(lat, lon){
        const q = encodeURIComponent(`${lat},${lon}`);
        window.open(`https://www.google.com/maps/search/?api=1&query=${q}`, "_blank");
      }

      function queryStops(lat,lon,rad){
        const a=`(around:${rad},${lat},${lon})`;
        return `[out:json][timeout:60];(
          node${a}[public_transport=platform];
          node${a}[highway=bus_stop];
          node${a}[railway=tram_stop];
        );out body;`;
      }

      function queryRoutes(lat, lon, rad){
        const a = `(around:${rad},${lat},${lon})`;
        return `[out:json][timeout:60];
          (
            node${a}[public_transport=platform];
            node${a}[highway=bus_stop];
            node${a}[railway=tram_stop];
          )->.s;

          (
            rel(bn.s)[type=route][route~"^(bus|tram|trolleybus)$"];
            rel(around.s:200)[type=route][route~"^(bus|tram|trolleybus)$"];
          );
          out body;`;
      }

      async function fetchOverpass(q, idx=0, errs=[]){
        if (idx >= OVERPASS_LIST.length) throw new Error(errs.join(" | "));
        const base = OVERPASS_LIST[idx];
        const host = new URL(base).host;
        const ctl = new AbortController();
        const timer = setTimeout(() => ctl.abort(), 45000);

        try{
          const r = await fetch(base + "?data=" + encodeURIComponent(q), {
            signal: ctl.signal,
            headers: { "Accept": "application/json" }
          });
          if(!r.ok) throw new Error("HTTP " + r.status);
          return await r.json();
        }catch(e){
          const why = e.name==="AbortError" ? "timeout" : (e.message || "network");
          errs.push(`${host}: ${why}`);
          return fetchOverpass(q, idx+1, errs);
        }finally{
          clearTimeout(timer);
        }
      }

      function setPosition(lat,lon,fly){
        last=[lat,lon];
        if(me) map.removeLayer(me);
        if(circle) map.removeLayer(circle);

        const rad=parseInt(radiusEl.value,10);
        me=L.circleMarker(last,{radius:8,color:"#fff",weight:3,fillColor:"#0b5c8a",fillOpacity:1}).addTo(map);
        circle=L.circle(last,{radius:rad,color:"#0b5c8a",weight:1,fillOpacity:.06}).addTo(map);

        if(fly) map.fitBounds(circle.getBounds(),{padding:[10,10]});
        loadStops(lat,lon,rad);
      }

      async function loadStops(lat,lon,rad){
        const my = ++reqId;
        listEl.innerHTML = "";
        layer.clearLayers();
        markers = {};

        try{
          setStatus("Caut stațiile…");
          const sData = await fetchOverpass(queryStops(lat,lon,rad));
          if(my!==reqId) return;

          const nodes=(sData.elements||[]).filter(e=>e.type==="node");
          render(nodes, [], [lat,lon], rad);

          if(!nodes.length) return;

          setStatus("Caut liniile…");
          try{
            const rData = await fetchOverpass(queryRoutes(lat,lon,rad));
            if(my!==reqId) return;
            const rels=(rData.elements||[]).filter(e=>e.type==="relation");
            render(nodes, rels, [lat,lon], rad);
          }catch(e){
            if(my!==reqId) return;
            setStatus(nodes.length + ` stații în ${rad} m. Liniile nu sunt disponibile acum.`);
          }
        }catch(e){
          if(my!==reqId) return;
          setStatus("Nu am putut încărca datele: " + e.message);
        }
      }

      function groupRoutes(rels){
        const m = {};
        rels.forEach(r=>{
          const t=r.tags||{};
          const mode=t.route||"bus";
          const ref=t.ref||t.name||"?";
          const k=mode+"|"+ref;
          if(!m[k]) m[k]={mode,ref,ends:{}};
          const dir = (t.from||t.to) ? `${t.from||""}${(t.from&&t.to)?" → ":""}${t.to||""}` : "";
          if(dir) m[k].ends[dir]=1;
        });
        return Object.values(m).sort((a,b)=>{
          if(a.mode!==b.mode) return (MODE_ORDER[a.mode]??9)-(MODE_ORDER[b.mode]??9);
          return String(a.ref).localeCompare(String(b.ref),"ro",{numeric:true});
        });
      }

      function render(nodes, rels, origin, rad){
        const nearLines = groupRoutes(rels);

        const stops = nodes.map(n=>{
          const directRels = rels.filter(r =>
            (r.members || []).some(mm => mm.type === "node" && String(mm.ref) === String(n.id))
          );

          let lines = groupRoutes(directRels);
          let approx = false;

          if (!lines.length && nearLines.length) {
            lines = nearLines;
            approx = true;
          }

          return {
            id:String(n.id),
            name:(n.tags&&n.tags.name)||"Stație fără nume",
            pos:[n.lat,n.lon],
            d:dist(origin,[n.lat,n.lon]),
            lines,
            approx
          };
        }).sort((a,b)=>a.d-b.d);

        listEl.innerHTML="";
        layer.clearLayers();
        markers={};

        if(!stops.length){
          setStatus(`Nicio stație în ${rad} m. Mărește raza sau mută punctul.`);
          return;
        }

        setStatus(`${stops.length} stații în ${rad} m. Apasă pe o linie pentru Google Maps.`);

        stops.forEach(s=>{
          const m=L.circleMarker(s.pos,{radius:7,color:"#fff",weight:2,fillColor:"#c8362d",fillOpacity:1}).bindTooltip(s.name).addTo(layer);
          m.on("click",()=>focusStop(s.id,true));
          markers[s.id]=m;

          const li=document.createElement("li");
          li.className="stop";
          li.id="stop-"+s.id;

          const top=document.createElement("div");
          top.className="top";
          top.innerHTML=`<span class="name"></span><span class="dist">${Math.round(s.d)} m</span>`;
          top.querySelector(".name").textContent=s.name;
          li.appendChild(top);

          if(s.approx){
            const h=document.createElement("div");
            h.className="hint";
            h.textContent="Linii găsite în zonă (aproximativ).";
            li.appendChild(h);
          }

          if(!s.lines.length){
            const none=document.createElement("div");
            none.className="hint";
            none.textContent="Nicio linie disponibilă în datele curente.";
            li.appendChild(none);
          }else{
            const chips=document.createElement("div");
            chips.className="chips";
            s.lines.forEach(g=>{
              const a=document.createElement("a");
              a.href="#";
              a.className="chip "+g.mode;
              a.textContent=g.ref;
              a.title=(MODE_LABEL[g.mode]||"Linie")+" "+g.ref;
              a.addEventListener("click",function(ev){
                ev.preventDefault();
                openLineInGoogleMaps(g.ref, s.name);
              });
              chips.appendChild(a);
            });
            li.appendChild(chips);

            const det=document.createElement("details");
            const sm=document.createElement("summary");
            sm.textContent="Direcții";
            det.appendChild(sm);

            const ul=document.createElement("ul");
            ul.className="routes";
            s.lines.forEach(g=>{
              const row=document.createElement("li");
              const b=document.createElement("b");
              b.textContent=g.ref;
              const ends=Object.keys(g.ends||{}).join("; ");
              row.appendChild(b);
              row.appendChild(document.createTextNode(" "+(MODE_LABEL[g.mode]||"")+(ends?" · "+ends:"")));
              ul.appendChild(row);
            });
            det.appendChild(ul);
            li.appendChild(det);
          }

          const actions=document.createElement("div");
          actions.className="actions";

          const openStop=document.createElement("a");
          openStop.className="maplink";
          openStop.href="#";
          openStop.textContent="📍 Stația în Google Maps";
          openStop.addEventListener("click",function(ev){
            ev.preventDefault();
            openStopInGoogleMaps(s.pos[0], s.pos[1]);
          });
          actions.appendChild(openStop);

          const showBtn=document.createElement("button");
          showBtn.type="button";
          showBtn.textContent="Arată pe hartă";
          showBtn.addEventListener("click",()=>focusStop(s.id,false));
          actions.appendChild(showBtn);

          li.appendChild(actions);

          li.addEventListener("click",function(ev){
            if(ev.target.closest("a,button,summary,details")) return;
            focusStop(s.id,false);
          });

          listEl.appendChild(li);
        });
      }

      function focusStop(id,scroll){
        document.querySelectorAll(".stop.active").forEach(x=>x.classList.remove("active"));
        const li=document.getElementById("stop-"+id);
        if(li){
          li.classList.add("active");
          if(scroll) li.scrollIntoView({behavior:"smooth",block:"center"});
        }
        if(markers[id]){
          markers[id].openTooltip();
          if(!scroll) map.panTo(markers[id].getLatLng());
        }
      }

      document.getElementById("locate").addEventListener("click",function(){
        if(!navigator.geolocation){
          setStatus("Browserul nu oferă locația. Atinge un punct pe hartă.");
          return;
        }
        if(!window.isSecureContext){
          setStatus("Locația merge doar pe HTTPS (ex: GitHub Pages).");
          return;
        }
        setStatus("Aștept locația…");
        navigator.geolocation.getCurrentPosition(
          p=>setPosition(p.coords.latitude,p.coords.longitude,true),
          err=>{
            const why = err.code===1 ? "Permisiunea pentru locație este refuzată."
                      : err.code===3 ? "Locația a durat prea mult."
                      : "Locația nu este disponibilă.";
            setStatus(why + " Atinge un punct pe hartă.");
          },
          { enableHighAccuracy:true, timeout:20000, maximumAge:60000 }
        );
      });

      map.on("click", e => setPosition(e.latlng.lat, e.latlng.lng, false));
      radiusEl.addEventListener("change", ()=>{ if(last) setPosition(last[0], last[1], true); });
    })();
  </script>
</body>
</html>
