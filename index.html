<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Stații în apropiere · Timișoara</title>
<link rel="icon" href="data:,">
<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
:root {
  --bg: #f3f5f7;
  --surface: #ffffff;
  --ink: #14212b;
  --muted: #5d6b76;
  --line: #d9e0e5;
  --accent: #0b5c8a;
  --tram: #c8362d;
  --troll: #1b6fb5;
  --bus: #2f7d4f;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #10171c;
    --surface: #18222a;
    --ink: #e8eef2;
    --muted: #a4b3bd;
    --line: #2a3944;
    --accent: #74c2ef;
    --tram: #a82e27;
    --troll: #195d99;
    --bus: #24613d;
    color-scheme: dark;
  }
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}

header {
  padding: 16px 16px 8px;
}

h1 {
  margin: 0;
  font-size: 1.35rem;
}

header p {
  margin: 4px 0;
  color: var(--muted);
  font-size: .92rem;
}

.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 8px 16px 12px;
}

button,
select,
.map-link {
  font: inherit;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--surface);
  color: var(--ink);
  padding: 10px 14px;
  min-height: 44px;
}

button {
  cursor: pointer;
}

button.primary {
  background: #0b5c8a;
  border-color: #0b5c8a;
  color: #fff;
  font-weight: 600;
}

button:disabled {
  opacity: .65;
  cursor: wait;
}

a:focus-visible,
button:focus-visible,
select:focus-visible,
summary:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 3px;
}

.notice {
  margin: 0 16px 12px;
  padding: 10px 12px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  color: var(--muted);
  font-size: .88rem;
}

#map {
  height: 38vh;
  min-height: 230px;
  margin: 0 16px;
  border: 1px solid var(--line);
  border-radius: 14px;
}

#status {
  padding: 12px 16px 4px;
  color: var(--muted);
  font-size: .92rem;
}

#list {
  list-style: none;
  margin: 0;
  padding: 4px 16px 32px;
  display: grid;
  gap: 10px;
  max-width: 760px;
}

.stop {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 12px 14px;
}

.stop.active {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent);
}

.top {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
}

.name {
  font-weight: 650;
}

.dist {
  color: var(--muted);
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 8px;
}

.chip {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 44px;
  padding: 8px 12px;
  border: 0;
  border-radius: 8px;
  color: #fff;
  font-weight: 700;
  font-size: .95rem;
  text-decoration: none;
}

.chip.tram {
  background: var(--tram);
}

.chip.trolleybus {
  background: var(--troll);
}

.chip.bus {
  background: var(--bus);
}

.chip:active {
  opacity: .8;
}

.none,
.hint {
  margin: 8px 0 0;
  color: var(--muted);
  font-size: .86rem;
}

details {
  margin-top: 8px;
}

summary {
  cursor: pointer;
  color: var(--accent);
  min-height: 44px;
  padding: 10px 0;
  font-size: .9rem;
}

.routes {
  margin: 0;
  padding: 0;
  list-style: none;
  display: grid;
  gap: 8px;
  font-size: .92rem;
}

.routes a {
  display: inline-flex;
  align-items: center;
  min-height: 44px;
  color: var(--accent);
  font-weight: 700;
  padding-right: 10px;
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 12px;
}

.map-link {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--accent);
  text-decoration: none;
  font-size: .9rem;
}

.leaflet-container {
  font: inherit;
}
</style>
</head>

<body>
<header>
  <h1>Stații în apropiere</h1>
  <p>Timișoara · tramvaie, troleibuze și autobuze</p>
</header>

<div class="controls">
  <button class="primary" id="locate" type="button">
    Folosește locația mea
  </button>

  <select id="radius" aria-label="Rază de căutare">
    <option value="300">300 m</option>
    <option value="500" selected>500 m</option>
    <option value="800">800 m</option>
  </select>
</div>

<p class="notice">
  Apasă pe numărul unei linii pentru a o căuta în Google Maps.
  Această versiune nu afișează poziții live sau timpi de sosire.
</p>

<div id="map" aria-label="Hartă cu stațiile din apropiere"></div>

<div id="status" role="status" aria-live="polite">
  Apasă pe buton sau atinge un punct pe hartă.
</div>

<ul id="list"></ul>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
