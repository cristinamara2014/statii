<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stații în apropiere · Timișoara</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#14212b; --muted:#5d6b76; --line:#d9e0e5;
  --accent:#0b5c8a; --tram:#c8362d; --troll:#1b6fb5; --bus:#2f7d4f;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10171c; --surface:#18222a; --ink:#e8eef2; --muted:#93a3ae; --line:#2a3944;
    --accent:#5eb4e6; --tram:#e5645b; --troll:#5aa3e0; --bus:#5fb583;
  }
}
:root[data-theme="dark"]{
  --bg:#10171c; --surface:#18222a; --ink:#e8eef2; --muted:#93a3ae; --line:#2a3944;
  --accent:#5eb4e6; --tram:#e5645b; --troll:#5aa3e0; --bus:#5fb583;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:16px 16px 8px}
h1{margin:0;font-size:1.35rem;letter-spacing:-.01em}
header p{margin:2px 0 0;color:var(--muted);font-size:.92rem}
.controls{display:flex;gap:8px;padding:8px 16px 12px;flex-wrap:wrap}
button,select{font:inherit;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 14px;min-height:44px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) button.primary{color:#08141b}}
button:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#map{height:38vh;min-height:230px;margin:0 16px;border-radius:14px;border:1px solid var(--line)}
#status{padding:12px 16px 4px;color:var(--muted);font-size:.92rem}
#list{list-style:none;margin:0;padding:4px 16px 32px;display:grid;gap:10px;max-width:760px}
.stop{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stop.active{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.top{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.name{font-weight:650}
.dist{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-block;min-width:34px;text-align:center;padding:3px 9px;border-radius:7px;color:#fff;font-weight:700;font-size:.9rem}
.chip.tram{background:var(--tram)} .chip.trolleybus{background:var(--troll)} .chip.bus{background:var(--bus)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip{color:#0a1014}}
details{margin-top:8px}
summary{cursor:pointer;color:var(--accent);font-size:.9rem;min-height:32px;display:flex;align-items:center}
.routes{margin:6px 0 0;padding:0;list-style:none;font-size:.92rem;display:grid;gap:4px}
.routes b{display:inline-block;min-width:2.2em}
.none{color:var(--muted);font-size:.9rem;margin-top:6px}
.leaflet-container{font:inherit}

.rt{margin:0 16px 10px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:2px 14px}
.rt summary{min-height:44px}
.rt .row{display:grid;gap:8px;padding:4px 0 12px}
.rt label{font-size:.88rem;color:var(--muted);display:grid;gap:4px}
.rt input{font:inherit;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:10px 12px;min-height:44px;width:100%}
.rt input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.rt small{color:var(--muted)}
#rtstatus{font-size:.9rem;color:var(--muted);padding-bottom:10px}
.badge{font-size:.8rem;color:var(--accent);margin-left:8px}
.etarow{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:baseline;margin-top:8px}
.etarow .what{color:var(--muted);font-size:.88rem;grid-column:2}
.etarow .when{grid-column:2;font-weight:600;font-variant-numeric:tabular-nums}
.etarow .when.off{font-weight:400;color:var(--muted)}
</style>
</head>
<body>
<header>
  <h1>Stații în apropiere</h1>
  <p>Timișoara · linii de tramvai, troleibuz și autobuz</p>
</header>

<div class="controls">
  <button class="primary" id="locate">Folosește locația mea</button>
  <select id="radius" aria-label="Rază de căutare">
    <option value="300">300 m</option>
    <option value="500" selected>500 m</option>
    <option value="800">800 m</option>
  </select>
</div>

<details class="rt" id="rtpanel">
  <summary>Sosiri în timp real (Tranzy)<span class="badge" id="rtbadge"></span></summary>
  <div class="row">
    <label>Cheie API Tranzy
      <input id="rtkey" type="password" autocomplete="off" spellcheck="false" placeholder="lipește cheia aici">
    </label>
    <label>ID agenție (opțional, se detectează automat)
      <input id="rtagency" inputmode="numeric" autocomplete="off" placeholder="gol = caut Timișoara">
    </label>
    <button class="primary" id="rtconnect" type="button">Conectează</button>
    <small>Cheia gratuită se cere de pe tranzy.ai. Rămâne doar în browserul tău.</small>
    <div id="rtstatus" role="status"></div>
  </div>
</details>

<div id="map" role="application" aria-label="Hartă cu stațiile din apropiere"></div>
<div id="status">Apasă pe buton sau atinge un punct pe hartă.</div>
<ul id="list"></ul>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function(){
  var CENTER = [45.7537, 21.2257]; // Piața Victoriei
  var OVERPASS = "https://overpass-api.de/api/interpreter";
  var TZ = "https://api.tranzy.ai/v1/opendata";
  var MODE_LABEL = {tram:"Tramvai", trolleybus:"Troleibuz", bus:"Autobuz"};
  var MODE_ORDER = {tram:0, trolleybus:1, bus:2};

  var map = L.map("map").setView(CENTER, 14);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19, attribution: "© OpenStreetMap"
  }).addTo(map);

  var me = null, circle = null, layer = L.layerGroup().addTo(map);
  var markers = {};
  var statusEl = document.getElementById("status");
  var listEl = document.getElementById("list");
  var radiusEl = document.getElementById("radius");
  var last = null;

  // ---- Tranzy (timp real) ----
  var RT = {key:null, agency:null, ready:false, routes:{}, stops:{}, stopList:[],
            tripSeq:{}, stopRoutes:{}, timer:null, shown:[]};
  var rtStatus = document.getElementById("rtstatus");
  var rtBadge = document.getElementById("rtbadge");
  var rtKey = document.getElementById("rtkey");
  var rtAgency = document.getElementById("rtagency");
  var rtBtn = document.getElementById("rtconnect");

  try{
    rtKey.value = localStorage.getItem("tz_key") || "";
    rtAgency.value = localStorage.getItem("tz_agency") || "";
  }catch(e){}

  function setStatus(t){ statusEl.textContent = t; }
  function setRt(t){ rtStatus.textContent = t; }

  function dist(a, b){
    var R = 6371000, r = Math.PI/180;
    var dLat = (b[0]-a[0])*r, dLon = (b[1]-a[1])*r;
    var x = Math.sin(dLat/2)*Math.sin(dLat/2) +
            Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dLon/2)*Math.sin(dLon/2);
    return 2*R*Math.asin(Math.sqrt(x));
  }

  function tz(path){
    var h = {"Accept":"application/json", "X-API-KEY":RT.key};
    if(RT.agency) h["X-Agency-Id"] = RT.agency;
    return fetch(TZ + path, {headers:h}).then(function(r){
      if(r.status === 401 || r.status === 403) throw new Error("cheie respinsă (" + r.status + ")");
      if(!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    });
  }

  function modeOf(r){
    var t = Number(r.route_type);
    if(t === 0) return "tram";
    if(t === 11 || t === 800) return "trolleybus";
    return "bus";
  }

  function connect(){
    RT.key = rtKey.value.trim();
    RT.agency = rtAgency.value.trim() || null;
    RT.ready = false; stopTimer();
    if(!RT.key){ setRt("Lipește mai întâi cheia API."); return; }
    rtBtn.disabled = true;
    setRt("Caut agenția…");
    var pre = RT.agency ? Promise.resolve() : tz("/agency").then(function(list){
      list = Array.isArray(list) ? list : (list && list.data) || [];
      var a = list.filter(function(x){ return /timi/i.test((x.agency_name || "") + " " + (x.agency_url || "")); })[0];
      if(!a) throw new Error("nu găsesc agenția Timișoara; introdu ID-ul manual");
      RT.agency = String(a.agency_id);
    });
    pre.then(function(){
      setRt("Descarc liniile și stațiile (agenția " + RT.agency + ")…");
      return Promise.all([tz("/routes"), tz("/stops"), tz("/trips"), tz("/stop_times")]);
    }).then(function(res){
      buildStatic(res[0], res[1], res[2], res[3]);
      try{ localStorage.setItem("tz_key", RT.key); localStorage.setItem("tz_agency", RT.agency); }catch(e){}
      RT.ready = true;
      rtBadge.textContent = "· conectat";
      setRt("Conectat. " + RT.stopList.length + " stații, " + Object.keys(RT.routes).length + " linii.");
      if(last) setPosition(last[0], last[1], false);
      else setStatus("Apasă pe buton sau atinge un punct pe hartă.");
    }).catch(function(e){
      rtBadge.textContent = "";
      var msg = (e instanceof TypeError)
        ? "Browserul a blocat cererea (probabil CORS) sau nu ai internet. Vezi nota din mesaj."
        : "Nu m-am putut conecta: " + e.message;
      setRt(msg);
    }).then(function(){ rtBtn.disabled = false; });
  }

  function buildStatic(routes, stops, trips, stopTimes){
    function arr(x){ return Array.isArray(x) ? x : (x && x.data) || []; }
    RT.routes = {}; RT.stops = {}; RT.stopList = []; RT.tripSeq = {}; RT.stopRoutes = {};
    arr(routes).forEach(function(r){
      RT.routes[String(r.route_id)] = {ref:String(r.route_short_name || r.route_id), mode:modeOf(r)};
    });
    arr(stops).forEach(function(s){
      var o = {id:String(s.stop_id), name:s.stop_name || "Stație fără nume",
               pos:[parseFloat(s.stop_lat), parseFloat(s.stop_lon)]};
      if(isNaN(o.pos[0]) || isNaN(o.pos[1])) return;
      RT.stops[o.id] = o; RT.stopList.push(o);
    });
    var tripInfo = {};
    arr(trips).forEach(function(t){
      tripInfo[String(t.trip_id)] = {route:String(t.route_id), head:t.trip_headsign || ""};
    });
    var tmp = {};
    arr(stopTimes).forEach(function(x){
      var tid = String(x.trip_id), sid = String(x.stop_id), t = tripInfo[tid];
      if(!t) return;
      (tmp[tid] = tmp[tid] || []).push([Number(x.stop_sequence), sid]);
      var m = RT.stopRoutes[sid] = RT.stopRoutes[sid] || {};
      var r = m[t.route] = m[t.route] || {};
      if(t.head) r[t.head] = 1;
    });
    Object.keys(tmp).forEach(function(tid){
      tmp[tid].sort(function(a, b){ return a[0] - b[0]; });
      RT.tripSeq[tid] = tmp[tid].map(function(p){ return p[1]; });
    });
  }

  function stopTimer(){ if(RT.timer){ clearInterval(RT.timer); RT.timer = null; } }

  function startTimer(){
    stopTimer();
    RT.timer = setInterval(function(){ if(!document.hidden) refreshEta(); }, 30000);
  }

  function fmtMin(m){
    if(m < 0.75) return "acum";
    return Math.round(m) + " min";
  }

  function etasFor(stopId, routeId, vehicles){
    var out = [];
    vehicles.forEach(function(v){
      if(String(v.route_id) !== routeId) return;
      var seq = RT.tripSeq[String(v.trip_id)];
      if(!seq) return;
      var si = seq.indexOf(stopId);
      if(si < 0) return;
      var vp = [parseFloat(v.latitude), parseFloat(v.longitude)];
      if(isNaN(vp[0]) || isNaN(vp[1])) return;
      var k = -1, best = 1e12;
      for(var i = 0; i < seq.length; i++){
        var s = RT.stops[seq[i]];
        if(!s) continue;
        var d = dist(vp, s.pos);
        if(d < best){ best = d; k = i; }
      }
      if(k < 0 || k > si) return;
      var path = best;
      for(var j = k; j < si; j++){
        var a = RT.stops[seq[j]], b = RT.stops[seq[j+1]];
        if(a && b) path += dist(a.pos, b.pos);
      }
      var sp = Number(v.speed) > 2 ? Number(v.speed) : 5; // m/s, ~18 km/h implicit
      out.push(path / sp / 60);
    });
    out.sort(function(a, b){ return a - b; });
    return out;
  }

  function refreshEta(){
    if(!RT.ready || !RT.shown.length) return;
    tz("/vehicles").then(function(list){
      list = Array.isArray(list) ? list : (list && list.data) || [];
      var now = Date.now();
      var vehicles = list.filter(function(v){
        if(v.latitude == null || v.longitude == null || v.trip_id == null) return false;
        var ts = Date.parse(v.timestamp);
        if(!isNaN(ts) && /(Z|[+-]\d\d:?\d\d)$/.test(String(v.timestamp)) && now - ts > 10*60*1000) return false;
        return true;
      });
      RT.shown.forEach(function(s){
        s.lines.forEach(function(g){
          var el = document.getElementById("eta-" + s.id + "-" + g.rid);
          if(!el) return;
          var e = etasFor(s.id, g.rid, vehicles).slice(0, 3);
          if(e.length){ el.textContent = e.map(fmtMin).join(" · "); el.className = "when"; }
          else { el.textContent = "nicio mașină în apropiere"; el.className = "when off"; }
        });
      });
    }).catch(function(e){
      setStatus("Nu am putut citi vehiculele (" + e.message + ").");
    });
  }

  function loadRT(lat, lon, rad){
    var origin = [lat, lon];
    var stops = RT.stopList.map(function(s){
      return {id:s.id, name:s.name, pos:s.pos, d:dist(origin, s.pos)};
    }).filter(function(s){ return s.d <= rad; })
      .sort(function(a, b){ return a.d - b.d; }).slice(0, 40);
    stops.forEach(function(s){
      var m = RT.stopRoutes[s.id] || {};
      s.lines = Object.keys(m).map(function(rid){
        var r = RT.routes[rid] || {ref:"?", mode:"bus"};
        return {mode:r.mode, ref:r.ref, rid:rid, ends:m[rid]};
      });
      s.lines.sort(function(x, y){
        if(x.mode !== y.mode) return MODE_ORDER[x.mode] - MODE_ORDER[y.mode];
        return String(x.ref).localeCompare(String(y.ref), "ro", {numeric:true});
      });
    });
    renderStops(stops, rad, true);
    RT.shown = stops;
    refreshEta();
    startTimer();
  }

  // ---- poziție și date OpenStreetMap ----
  function setPosition(lat, lon, fly){
    last = [lat, lon];
    if(me) map.removeLayer(me);
    if(circle) map.removeLayer(circle);
    var rad = parseInt(radiusEl.value, 10);
    me = L.circleMarker(last, {radius:8, color:"#fff", weight:3, fillColor:"#0b5c8a", fillOpacity:1}).addTo(map);
    circle = L.circle(last, {radius:rad, color:"#0b5c8a", weight:1, fillOpacity:.06}).addTo(map);
    if(fly) map.fitBounds(circle.getBounds(), {padding:[10,10]});
    if(RT.ready) loadRT(lat, lon, rad); else { stopTimer(); loadOSM(lat, lon, rad); }
  }

  function query(lat, lon, rad){
    var a = "(around:" + rad + "," + lat + "," + lon + ")";
    return "[out:json][timeout:25];" +
      "(node" + a + "[public_transport=platform];" +
      "node" + a + "[highway=bus_stop];" +
      "node" + a + "[railway=tram_stop];)->.s;" +
      "rel(bn.s)[type=route][route~\"^(bus|tram|trolleybus)$\"]->.r;" +
      "(.s;.r;);out body;";
  }

  var OVERPASS_LIST = [
    "https://overpass-api.de/api/interpreter",
    "https://overpass.kumi.systems/api/interpreter"
  ];

  function fetchOverpass(q, idx, errs, label){
    errs = errs || [];
    if(idx >= OVERPASS_LIST.length){
      var e = new Error(errs.join(" | ")); e.all = true; return Promise.reject(e);
    }
    var host = OVERPASS_LIST[idx].split("/")[2];
    var ctl = new AbortController();
    var timer = setTimeout(function(){ ctl.abort(); }, 25000);
    setStatus(label + " (" + host + ")…");
    return fetch(OVERPASS_LIST[idx] + "?data=" + encodeURIComponent(q), {signal:ctl.signal})
    .then(function(r){
      clearTimeout(timer);
      if(!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    }).catch(function(err){
      clearTimeout(timer);
      errs.push(host + ": " + (err.name === "AbortError" ? "timp depășit" : err.message));
      return fetchOverpass(q, idx + 1, errs, label);
    });
  }

  function queryStops(lat, lon, rad){
    var a = "(around:" + rad + "," + lat + "," + lon + ")";
    return "[out:json][timeout:20];(node" + a + "[public_transport=platform];" +
      "node" + a + "[highway=bus_stop];node" + a + "[railway=tram_stop];);out body;";
  }
  function queryRoutes(lat, lon, rad){
    var a = "(around:" + rad + "," + lat + "," + lon + ")";
    return "[out:json][timeout:25];(node" + a + "[public_transport=platform];" +
      "node" + a + "[highway=bus_stop];node" + a + "[railway=tram_stop];)->.s;" +
      "rel(bn.s)[type=route][route~\"^(bus|tram|trolleybus)$\"];out body;";
  }

  var reqId = 0;
  function loadOSM(lat, lon, rad){
    var my = ++reqId, origin = [lat, lon], nodes = [];
    listEl.innerHTML = "";
    layer.clearLayers(); markers = {};
    fetchOverpass(queryStops(lat, lon, rad), 0, [], "Caut stațiile").then(function(data){
      if(my !== reqId) return;
      nodes = (data.elements || []).filter(function(e){ return e.type === "node"; });
      renderOSM(nodes, origin, rad);
      if(!nodes.length) return;
      setStatus(nodes.length + " stații găsite. Caut liniile…");
      return fetchOverpass(queryRoutes(lat, lon, rad), 0, [], "Caut liniile").then(function(d2){
        if(my !== reqId) return;
        renderOSM(nodes.concat((d2.elements || []).filter(function(e){ return e.type === "relation"; })), origin, rad);
      }).catch(function(e){
        if(my !== reqId) return;
        statusEl.textContent = nodes.length + " stații găsite, dar liniile nu s-au încărcat (" + e.message + ").";
      });
    }).catch(function(e){
      if(my !== reqId) return;
      setStatus("Nu am putut încărca stațiile. " + e.message);
    });
  }

  function renderOSM(els, origin, rad){
    var nodes = {}, byNode = {};
    els.forEach(function(e){ if(e.type === "node") nodes[e.id] = e; });
    els.forEach(function(e){
      if(e.type !== "relation" || !e.tags) return;
      (e.members || []).forEach(function(m){
        if(m.type !== "node" || !nodes[m.ref]) return;
        (byNode[m.ref] = byNode[m.ref] || []).push(e);
      });
    });
    var stops = Object.keys(nodes).map(function(id){
      var n = nodes[id], rels = byNode[id] || [], groups = {};
      rels.forEach(function(r){
        var t = r.tags, ref = t.ref || t.name || "?";
        var key = t.route + "|" + ref;
        var g = groups[key] = groups[key] || {mode:t.route, ref:ref, ends:{}};
        var to = t.to || (t.name && t.name.indexOf("⇒") > -1 ? t.name.split("⇒").pop().trim() : "") ||
                 (t.name && t.name.indexOf("=>") > -1 ? t.name.split("=>").pop().trim() : "");
        var from = t.from || "";
        g.ends[(from ? from + " → " : "") + to] = 1;
      });
      var lines = Object.keys(groups).map(function(k){ return groups[k]; });
      lines.sort(function(x, y){
        if(x.mode !== y.mode) return MODE_ORDER[x.mode] - MODE_ORDER[y.mode];
        return String(x.ref).localeCompare(String(y.ref), "ro", {numeric:true});
      });
      return {id:id, name:(n.tags && n.tags.name) || "Stație fără nume",
              pos:[n.lat, n.lon], d:dist(origin, [n.lat, n.lon]), lines:lines};
    });
    stops.sort(function(a, b){ return a.d - b.d; });
    renderStops(stops, rad, false);
  }

  // ---- afișare comună ----
  function renderStops(stops, rad, realtime){
    listEl.innerHTML = "";
    layer.clearLayers(); markers = {};
    if(!stops.length){
      setStatus("Nicio stație în " + rad + " m. Mărește raza sau mută punctul pe hartă.");
      return;
    }
    setStatus(stops.length + " stații în " + rad + " m, cele mai apropiate primele." +
              (realtime ? " Sosiri estimate, se actualizează la 30 s." : ""));

    stops.forEach(function(s){
      var m = L.circleMarker(s.pos, {radius:7, color:"#fff", weight:2, fillColor:"#c8362d", fillOpacity:1})
        .bindTooltip(s.name).addTo(layer);
      m.on("click", function(){ focusStop(s.id, true); });
      markers[s.id] = m;

      var li = document.createElement("li");
      li.className = "stop"; li.id = "stop-" + s.id;
      var top = document.createElement("div"); top.className = "top";
      var nm = document.createElement("span"); nm.className = "name"; nm.textContent = s.name;
      var ds = document.createElement("span"); ds.className = "dist"; ds.textContent = Math.round(s.d) + " m";
      top.appendChild(nm); top.appendChild(ds); li.appendChild(top);

      if(!s.lines.length){
        var none = document.createElement("div"); none.className = "none";
        none.textContent = realtime ? "Nicio linie asociată acestei stații." :
          "Nicio linie asociată acestei stații în datele OpenStreetMap.";
        li.appendChild(none);
      } else if(realtime){
        s.lines.forEach(function(g){
          var row = document.createElement("div"); row.className = "etarow";
          var c = document.createElement("span"); c.className = "chip " + g.mode; c.textContent = g.ref;
          var what = document.createElement("span"); what.className = "what";
          what.textContent = (MODE_LABEL[g.mode] || "") + (Object.keys(g.ends).length ? " · " + Object.keys(g.ends).join("; ") : "");
          var when = document.createElement("span"); when.className = "when off";
          when.id = "eta-" + s.id + "-" + g.rid; when.textContent = "se încarcă…";
          row.appendChild(c); row.appendChild(what); row.appendChild(when);
          li.appendChild(row);
        });
      } else {
        var chips = document.createElement("div"); chips.className = "chips";
        s.lines.forEach(function(g){
          var c = document.createElement("span");
          c.className = "chip " + g.mode; c.textContent = g.ref;
          c.title = MODE_LABEL[g.mode] || g.mode;
          chips.appendChild(c);
        });
        li.appendChild(chips);
        var det = document.createElement("details");
        var sm = document.createElement("summary"); sm.textContent = "Direcții";
        det.appendChild(sm);
        var ul = document.createElement("ul"); ul.className = "routes";
        s.lines.forEach(function(g){
          var row = document.createElement("li");
          var b = document.createElement("b"); b.textContent = g.ref;
          var ends = Object.keys(g.ends).filter(Boolean).join("; ");
          row.appendChild(b);
          row.appendChild(document.createTextNode(" " + (MODE_LABEL[g.mode] || "") + (ends ? " · " + ends : "")));
          ul.appendChild(row);
        });
        det.appendChild(ul); li.appendChild(det);
      }
      li.addEventListener("click", function(ev){
        if(ev.target.closest("summary")) return;
        focusStop(s.id, false);
      });
      listEl.appendChild(li);
    });
  }

  function focusStop(id, scroll){
    Array.prototype.forEach.call(document.querySelectorAll(".stop.active"), function(x){ x.classList.remove("active"); });
    var li = document.getElementById("stop-" + id);
    if(li){ li.classList.add("active"); if(scroll) li.scrollIntoView({behavior:"smooth", block:"center"}); }
    if(markers[id]){ markers[id].openTooltip(); if(!scroll) map.panTo(markers[id].getLatLng()); }
  }

  document.getElementById("locate").addEventListener("click", function(){
    if(!navigator.geolocation){ setStatus("Browserul nu oferă locația. Atinge un punct pe hartă."); return; }
    if(location.protocol === "file:"){
      setStatus("Locația nu merge pe un fișier deschis local. Atinge un punct pe hartă sau pune pagina online (https).");
      return;
    }
    setStatus("Aștept locația…");
    navigator.geolocation.getCurrentPosition(function(p){
      setPosition(p.coords.latitude, p.coords.longitude, true);
    }, function(err){
      var why = err.code === 1 ? "Permisiunea pentru locație e refuzată în browser."
              : err.code === 3 ? "Locația a durat prea mult. Încearcă afară sau cu GPS pornit."
              : "Locația nu e disponibilă.";
      setStatus(why + " Atinge un punct pe hartă.");
    }, {enableHighAccuracy:false, timeout:15000, maximumAge:60000});
  });

  rtBtn.addEventListener("click", connect);
  map.on("click", function(e){ setPosition(e.latlng.lat, e.latlng.lng, false); });
  radiusEl.addEventListener("change", function(){ if(last) setPosition(last[0], last[1], true); });
  document.addEventListener("visibilitychange", function(){ if(!document.hidden) refreshEta(); });
})();
</script>
</body>
</html>
