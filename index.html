<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Stații · Debug Safe</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    html,body{margin:0;height:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
    #map{height:70vh;min-height:320px;margin:12px;border:1px solid #ccc;border-radius:10px}
    #status{margin:12px;padding:10px;border-radius:8px;background:#f5f7fa}
    #log{margin:12px;padding:10px;border-radius:8px;background:#111;color:#0f0;font:12px/1.4 ui-monospace,monospace;white-space:pre-wrap}
    button{margin:12px;padding:10px 14px}
  </style>
</head>
<body>
  <button id="retry">Reinitializează harta</button>
  <div id="status">Pornire...</div>
  <div id="map"></div>
  <div id="log"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    (function(){
      const statusEl = document.getElementById('status');
      const logEl = document.getElementById('log');
      const mapEl = document.getElementById('map');
      let map = null;

      function log(msg){
        logEl.textContent += msg + "\n";
        console.log(msg);
      }
      function setStatus(msg){ statusEl.textContent = msg; log("STATUS: " + msg); }

      function initMap(){
        try{
          setStatus("Inițializare...");
          if(!window.L) throw new Error("window.L lipsește (Leaflet JS nu s-a încărcat)");
          log("Leaflet version: " + L.version);

          if(!mapEl) throw new Error("#map nu există în DOM");
          const h = mapEl.getBoundingClientRect().height;
          log("#map height: " + h);
          if(h < 120) throw new Error("#map are înălțime prea mică");

          if(map){ map.remove(); map = null; log("Map vechi eliminat."); }

          map = L.map('map', { zoomControl:true }).setView([45.7537,21.2257], 13);
          L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
          }).addTo(map);

          L.marker([45.7537,21.2257]).addTo(map).bindPopup('Timișoara').openPopup();

          setTimeout(() => map.invalidateSize(), 0);
          setTimeout(() => map.invalidateSize(), 300);

          setStatus("Hartă OK");
        }catch(err){
          setStatus("Map initialization script failed to run");
          log("ERROR: " + (err && err.message ? err.message : err));
        }
      }

      // log global errors
      window.addEventListener('error', e => log("window.error: " + e.message));
      window.addEventListener('unhandledrejection', e => log("unhandledrejection: " + (e.reason && e.reason.message ? e.reason.message : e.reason)));

      document.getElementById('retry').addEventListener('click', initMap);
      initMap();
    })();
  </script>
</body>
</html>
